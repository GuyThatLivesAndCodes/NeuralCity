[package]
name = "neuralcabin-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "NeuralCabin neural-network engine — tensors, autograd, layers, optimizers, all from scratch."

[lib]
name = "neuralcabin_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Burn provides tensor ops, autodiff, and optimizers with a pluggable backend.
# - `wgpu`     : GPU acceleration (cross-platform, runs on laptop/low-end GPUs)
# - `autodiff` : automatic differentiation (replaces our hand-written tape)
# - `ndarray`  : CPU backend (required so `cargo test` runs without a GPU)
# - `std`      : standard library bridge
# - `fusion`   : CubeCL kernel-fusion pass. Folds the dozens of tiny ops in a
#                transformer block (rmsnorm mul/add/sqrt, attention scale/mask,
#                SwiGLU multiply, residual add) into a handful of fused GPU
#                kernels. The single biggest GPU-side speedup for transformer
#                training — without it, each elementwise op is one dispatch
#                plus one read/write of working memory, and pre-norm transformer
#                blocks fire off ~20 such ops per layer.
# - `autotune` : Pick the best matmul kernel variant for the current GPU and
#                input shape at runtime. The wgpu backend ships several matmul
#                strategies (loop-tile, tensor-core, vectorized); the right
#                choice depends on (M, K, N) and the GPU. Without autotune the
#                fallback kernel is often 2–4× slower than the best variant
#                for the shapes a small transformer hits.
burn = { version = "0.16", default-features = false, features = ["wgpu", "autodiff", "ndarray", "std", "fusion", "autotune"] }

[dev-dependencies]
# Burn 0.16's autodiff backend has thread-local node state that breaks when
# multiple training-step tests run in parallel. We serialize them with
# `#[serial(autodiff)]` so the full suite is reliable under default cargo test.
serial_test = "3"
